<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Digital - CDN</title>
    <style>
        /* Importando a Digital-7 original direto de um espelho de CDN confiável */
        @font-face {
            font-family: 'Digital-7';
            src: url('https://cdn.jsdelivr.net/gh/peteroupc/Digital-7@master/digital-7%20(mono).ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .painel {
            font-family: 'Digital-7', sans-serif;
            font-size: 72px;
            color: #ff3333; /* Vermelho estilo painel industrial */
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            background: #2a0000;
            padding: 20px 40px;
            border-radius: 6px;
            border: 2px solid #ff3333;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="painel">180°C</div>

</body>
</html>
